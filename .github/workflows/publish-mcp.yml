name: Publish MCP Registry

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out reviewed default branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Download and verify publisher
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output publisher.tar.gz \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo 'a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  publisher.tar.gz' | sha256sum --check --strict
          tar -xzf publisher.tar.gz mcp-publisher
      - name: Verify live endpoint
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"registry-publication-check","version":"0.1.0"}}}' \
            https://everydaysoftware.ai/mcp/voice-demo > initialize.json
          python3 -c 'import json; r=json.load(open("initialize.json")); assert r.get("result", {}).get("serverInfo", {}).get("name"), r'
      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish reviewed server metadata
        run: ./mcp-publisher publish
